# Temporary diagnostic: does the Windows folder dialog appear on top?
name: Windows folder picker probe
on:
  push:
    branches: [fix/windows-folder-picker]
    paths: [desktop/windows/picker_probe.py, .github/workflows/picker-probe.yml, backend/modules/archive_location.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Current picker (as shipped)
        run: python desktop/windows/picker_probe.py current
      - name: Picker in the app's code (console parent)
        run: python desktop/windows/picker_probe.py module
      - name: Picker in the app's code, started without a console (like the installed app)
        run: python desktop/windows/picker_probe.py no-console
