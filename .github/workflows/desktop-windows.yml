# Builds the Windows (x64) desktop app and installer as a TESTING-ONLY build.
#
# The installer is not code-signed, so Windows SmartScreen may warn about an
# unknown publisher. No API keys or signing credentials are used or needed.
#
# The job installs the app silently (per-user, no admin), tests the installed
# app, uninstalls it, and checks that research data is kept.

name: Desktop build (Windows, testing-only)

on:
  workflow_dispatch:
  push:
    branches: [main, build/windows-installer]
    paths:
      - backend/**
      - frontend/**
      - desktop/**
      - .github/workflows/desktop-windows.yml

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PW_DISABLE_KEYRING: "1"     # tests must never touch the runner's Credential Manager
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyinstaller>=6.10" pystray pytest

      - name: Backend tests (Windows)
        working-directory: backend
        run: python -m pytest -q

      - name: Write build info and icons
        run: |
          mkdir -p build
          python - <<'PY'
          import json, os, datetime
          json.dump({
              "testing_build": True,
              "commit": os.environ["GITHUB_SHA"][:7],
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ"),
              "platform": "Windows-x64",
          }, open("build/build_info.json", "w"))
          PY
          python desktop/make_icons.py build
          VERSION=$(python -c "import sys; sys.path.insert(0,'backend'); import version; print(version.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app with PyInstaller
        run: |
          pyinstaller desktop/provenance_wiki.spec --noconfirm \
            --distpath build/pyi-dist --workpath build/pyi-work
          ls build/pyi-dist/ProvenanceWiki

      - name: Verify executable and bundle contents
        run: |
          python - <<'PY'
          import struct, sys
          from pathlib import Path
          app = Path("build/pyi-dist/ProvenanceWiki")
          exe = app / "ProvenanceWiki.exe"
          data = exe.read_bytes()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          subsystem = struct.unpack_from("<H", data, pe + 24 + 68)[0]
          print(f"machine=0x{machine:04x} (0x8664 = x64), subsystem={subsystem} (2 = windowed, no console)")
          bad = machine != 0x8664 or subsystem != 2
          for p in app.rglob("*"):
              n = p.name.lower()
              if n.startswith(".env") or n.endswith(".db") or n == "experiments" \
                      or n.startswith("experiment") or n.startswith("mcp_server"):
                  print("Should not be bundled:", p); bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DTesting=1" "desktop\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem build\ProvenanceWiki-Setup-*.exe | Select-Object -First 1
          "SETUP=$($setup.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-FileHash $setup.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($setup.Name)" } |
            Out-File -Encoding ascii "build\$($setup.Name).sha256"
          Get-ChildItem build\*.exe

      - name: Install silently (current user, no admin)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\$env:SETUP" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=build\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content build\install.log -Tail 40; exit $p.ExitCode }
          $exe = "$env:LOCALAPPDATA\Programs\Provenance Wiki\ProvenanceWiki.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Provenance Wiki (Testing).lnk"
          if (-not (Test-Path $exe)) { Write-Error "Installed app not found: $exe"; exit 1 }
          if (-not (Test-Path $lnk)) { Write-Error "Start menu shortcut not found: $lnk"; exit 1 }
          Write-Host "Installed: $exe"
          Write-Host "Start menu shortcut: $lnk"

      - name: Smoke test the installed app
        run: |
          EXE="$LOCALAPPDATA/Programs/Provenance Wiki/ProvenanceWiki.exe"
          set +e
          python desktop/smoke_test.py --data-dir "$RUNNER_TEMP/pw-smoke" --expect-testing-build -- "$EXE" \
            | tee build/smoke-test-windows.txt
          status=${PIPESTATUS[0]}
          echo "--- app log"; tail -40 "$RUNNER_TEMP/pw-smoke/logs/provenance-wiki.log" || true
          echo "--- crash log"; head -80 "$RUNNER_TEMP/pw-smoke/logs/crash.log" 2>/dev/null || true
          exit $status

      - name: Archive location story (first launch, choose, move, relaunch, unplug, reconnect)
        run: |
          EXE="$LOCALAPPDATA/Programs/Provenance Wiki/ProvenanceWiki.exe"
          python desktop/smoke_test.py --data-dir "$RUNNER_TEMP/pw-archive-flow" --archive-flow -- "$EXE" \
            | tee build/smoke-test-windows-archive.txt
          exit ${PIPESTATUS[0]}

      - name: Folder picker opens on top and can be cancelled (installed app)
        run: |
          python desktop/windows/picker_probe.py app "$LOCALAPPDATA/Programs/Provenance Wiki/ProvenanceWiki.exe" \
            | tee build/picker-test-windows.txt
          exit ${PIPESTATUS[0]}

      - name: Credential Manager test (dummy key, removed afterwards)
        continue-on-error: true
        run: |
          EXE="$LOCALAPPDATA/Programs/Provenance Wiki/ProvenanceWiki.exe"
          python desktop/smoke_test.py --data-dir "$RUNNER_TEMP/pw-smoke-cred" --test-keychain -- "$EXE" \
            | tee build/smoke-test-windows-credentials.txt
          PW_DISABLE_KEYRING=0 python -c "import keyring, sys; v = keyring.get_password('ProvenanceWiki', 'ANTHROPIC_API_KEY'); print('dummy key still stored' if v else 'Credential Manager clean'); sys.exit(1 if v else 0)"

      - name: Smoke test with the system-tray icon enabled
        continue-on-error: true
        run: |
          EXE="$LOCALAPPDATA/Programs/Provenance Wiki/ProvenanceWiki.exe"
          python desktop/smoke_test.py --data-dir "$RUNNER_TEMP/pw-smoke-tray" --expect-testing-build --keep-tray -- "$EXE" \
            | tee build/smoke-test-windows-tray.txt
          echo "--- app log"; tail -20 "$RUNNER_TEMP/pw-smoke-tray/logs/provenance-wiki.log" || true

      - name: First launch with real defaults; archive outside the program folder
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.request, winreg
          from pathlib import Path
          local = Path(os.environ["LOCALAPPDATA"])
          exe = local / "Programs" / "Provenance Wiki" / "ProvenanceWiki.exe"
          data = local / "ProvenanceWiki"
          cfg = local / "ProvenanceWiki Config"
          env = {k: v for k, v in os.environ.items() if k not in ("PW_DATA_DIR", "PW_CONFIG_DIR")}
          env.update(PW_NO_BROWSER="1", PW_NO_TRAY="1")
          p = subprocess.Popen([str(exe)], env=env)
          for _ in range(200):
              if (cfg / "instance.json").exists():
                  break
              time.sleep(0.3)
          port = json.loads((cfg / "instance.json").read_text())["port"]
          base = f"http://127.0.0.1:{port}"
          def call(path, body=None):
              req = urllib.request.Request(base + path, method="POST" if body is not None else "GET",
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={"X-Provenance-Wiki": "1", "Origin": base,
                                                    "Content-Type": "application/json"})
              return json.loads(urllib.request.urlopen(req).read())
          assert call("/api/health")["archive_state"] == "setup", "first launch should ask"
          assert not data.exists(), "nothing may be created before choosing"
          call("/api/archive/setup", {"use_default": True})
          call("/api/system/quit", {})
          p.wait(timeout=30)
          assert (data / "provenance.db").exists() and (data / "photos").is_dir()
          assert (data / "archive.json").exists()
          assert not any(exe.parent.glob("*.db")), "database written into the program folder"
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER, r"Software\ProvenanceWiki") as k:
              assert winreg.QueryValueEx(k, "ArchivePath")[0] == str(data)
          print("Archive created at", data, "and recorded for the uninstaller")
          PY

      - name: Uninstall silently; research data must be kept
        shell: pwsh
        run: |
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\Provenance Wiki\unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          $ok = $true
          if (Test-Path "$env:LOCALAPPDATA\Programs\Provenance Wiki\ProvenanceWiki.exe") { Write-Host "Program not removed"; $ok = $false }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Provenance Wiki (Testing).lnk") { Write-Host "Shortcut not removed"; $ok = $false }
          if (-not (Test-Path "$env:LOCALAPPDATA\ProvenanceWiki\provenance.db")) { Write-Host "Research data was deleted!"; $ok = $false }
          if ($ok) { Write-Host "Uninstall removed the program and kept the research archive." } else { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ProvenanceWiki-Windows-x64-TESTING-ONLY
          path: |
            build/${{ env.SETUP }}
            build/${{ env.SETUP }}.sha256
            build/smoke-test-windows*.txt
          retention-days: 90
          if-no-files-found: error
