# Material for the Mac install video (docs/video/): screenshots of a real
# install on a macOS desktop, and the narration (Kokoro TTS, Apache-2.0).
# Not part of the release build. No real API keys are used: the keys typed in
# are dummies and the calls that would reach Anthropic/Voyage are mocked.

name: Install video material (macOS)

on:
  workflow_dispatch:
  push:
    branches: [docs/install-video]
    paths:
      - docs/video/narration_mac.json
      - desktop/macos/capture_install_video.py
      - .github/workflows/install-video-capture-macos.yml

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthesise narration
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile
          python docs/video/make_narration.py docs/video/narration_mac.json narration
      - uses: actions/upload-artifact@v4
        with:
          name: install-video-mac-narration
          path: narration/
          retention-days: 14

  screens:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyinstaller>=6.10" pystray pyobjc-framework-Quartz playwright pillow
      - name: Build app and disk image
        run: |
          mkdir -p build
          python - <<'PY'
          import json, os, platform, datetime
          json.dump({"testing_build": True, "commit": os.environ["GITHUB_SHA"][:7],
                     "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ"),
                     "platform": f"macOS-{platform.machine()}"}, open("build/build_info.json", "w"))
          PY
          python desktop/make_icons.py build
          pyinstaller desktop/provenance_wiki.spec --noconfirm --distpath build/pyi-dist --workpath build/pyi-work
          APP="build/pyi-dist/Provenance Wiki (Testing).app"
          codesign --force --deep --sign - "$APP"
          VERSION=$(python -c "import sys; sys.path.insert(0,'backend'); import version; print(version.__version__)")
          STAGE=build/dmg; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp "desktop/macos/READ ME FIRST - TESTING BUILD.txt" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Provenance Wiki (Testing)" -srcfolder "$STAGE" -ov -format UDZO \
            "build/ProvenanceWiki-${VERSION}-macOS-arm64-TESTING-ONLY-unsigned.dmg"
      - name: Capture screenshots
        timeout-minutes: 20
        run: python desktop/macos/capture_install_video.py "$(ls build/*.dmg | head -1)" screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-video-mac-screens
          path: screens/
          retention-days: 14
